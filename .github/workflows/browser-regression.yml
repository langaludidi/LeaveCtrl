name: Production browser regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-regression.yml"
      - ".github/workflows/production-monitor.yml"
      - "release-tests/**"
      - "app/**"
      - "components/**"
      - "middleware.ts"
      - "next.config.*"
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: production-browser-regression
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 1440
            height: 1000
            label: chromium-desktop
          - browser: chromium
            width: 768
            height: 1024
            label: chromium-tablet
          - browser: chromium
            width: 390
            height: 844
            label: chromium-phone
          - browser: webkit
            width: 1440
            height: 1000
            label: webkit-desktop
          - browser: webkit
            width: 768
            height: 1024
            label: webkit-tablet
          - browser: webkit
            width: 390
            height: 844
            label: webkit-phone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned browser-regression tooling
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1 @axe-core/playwright@4.10.2

      - name: Install browser engines
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Classify production deployment requirement
        id: deploy_scope
        if: github.event_name == 'push'
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          health="$(curl -fsS --max-time 10 https://app.leavectrl.co.za/api/health || true)"
          deployed="$(printf '%s' "$health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).release_commit||"")}catch{}})')"

          if [ -z "$deployed" ]; then
            echo "::warning::Could not determine the production release commit; require exact convergence."
            echo "requires_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$deployed" = "$CURRENT_SHA" ]; then
            echo "Production already serves $CURRENT_SHA"
            echo "requires_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$deployed" "$CURRENT_SHA" || true
          if ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
            echo "::warning::Production commit $deployed is unavailable locally; require exact convergence."
            echo "requires_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$deployed" "$CURRENT_SHA" || true)"
          echo "Changes since production $deployed:"
          echo "$changed"

          requires_deploy=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/browser-regression.yml|.github/workflows/production-monitor.yml|release-tests/*)
                ;;
              *)
                requires_deploy=true
                ;;
            esac
          done <<< "$changed"

          echo "requires_deploy=$requires_deploy" >> "$GITHUB_OUTPUT"

      - name: Wait for exact production release
        if: github.event_name != 'push' || steps.deploy_scope.outputs.requires_deploy == 'true'
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 10 https://app.leavectrl.co.za/api/health || true)"
            deployed="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).release_commit||"")}catch{}})')"
            if [ "$deployed" = "$EXPECTED_COMMIT" ]; then
              echo "Production is serving $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Waiting for production commit (attempt $attempt/30): currently ${deployed:-unknown}"
            sleep 10
          done
          echo "::error::Production did not converge to $EXPECTED_COMMIT within five minutes."
          exit 1

      - name: Run production browser and WCAG regression
        env:
          LEAVECTRL_BASE_URL: https://app.leavectrl.co.za
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_WIDTH: ${{ matrix.width }}
          E2E_HEIGHT: ${{ matrix.height }}
        run: npx playwright test release-tests/browser-production.spec.mjs --reporter=line --workers=1

      - name: Regression summary
        if: success()
        run: |
          {
            echo "### LeaveCtrl production browser regression"
            echo "- Matrix: ${{ matrix.label }}"
            echo "- Protected-route redirect: PASS"
            echo "- Responsive viewport overflow: PASS"
            echo "- Keyboard focus visibility: PASS"
            echo "- WCAG serious/critical scan: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
