name: Production browser regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-regression.yml"
      - ".github/workflows/production-monitor.yml"
      - "release-tests/browser-production.spec.mjs"
      - "app/api/health/route.ts"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "middleware.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: production-browser-regression
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            width: 1440
            height: 1000
            label: chromium-desktop
          - browser: chromium
            width: 768
            height: 1024
            label: chromium-tablet
          - browser: chromium
            width: 390
            height: 844
            label: chromium-phone
          - browser: webkit
            width: 1440
            height: 1000
            label: webkit-desktop
          - browser: webkit
            width: 768
            height: 1024
            label: webkit-tablet
          - browser: webkit
            width: 390
            height: 844
            label: webkit-phone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned browser-regression tooling
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1 @axe-core/playwright@4.10.2

      - name: Install browser engines
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Resolve and verify production release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          current_release() {
            curl -fsS --max-time 10 https://app.leavectrl.co.za/api/health 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).release_commit||"")}catch{}})'
          }

          target="$EXPECTED_COMMIT"

          if [ "$EVENT_NAME" = "push" ]; then
            workflow_only="$(node - <<'NODE'
          const fs = require("fs");
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const paths = [...new Set((event.commits || []).flatMap((commit) => [
            ...(commit.added || []),
            ...(commit.modified || []),
            ...(commit.removed || []),
          ]))];
          process.stdout.write(paths.length > 0 && paths.every((path) => path.startsWith(".github/workflows/")) ? "true" : "false");
          NODE
            )"
            if [ "$workflow_only" = "true" ] && [ -n "${BEFORE_COMMIT:-}" ] && [ "$BEFORE_COMMIT" != "0000000000000000000000000000000000000000" ]; then
              target="$BEFORE_COMMIT"
              echo "Workflow-only push; validating already-live parent release $target"
            fi
          else
            target="$(current_release)"
            if [ -z "$target" ]; then
              echo "::error::Could not resolve current production release."
              exit 1
            fi
            echo "Scheduled/manual run; validating current production release $target"
          fi

          for attempt in $(seq 1 30); do
            deployed="$(current_release || true)"
            if [ "$deployed" = "$target" ]; then
              echo "Production release verified: $target"
              exit 0
            fi
            echo "Waiting for production commit (attempt $attempt/30): target=$target current=${deployed:-unknown}"
            sleep 10
          done

          echo "::error::Production did not converge to $target within five minutes."
          exit 1

      - name: Run production browser and WCAG regression
        env:
          LEAVECTRL_BASE_URL: https://app.leavectrl.co.za
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_WIDTH: ${{ matrix.width }}
          E2E_HEIGHT: ${{ matrix.height }}
        run: npx playwright test release-tests/browser-production.spec.mjs --reporter=line --workers=1

      - name: Regression summary
        if: success()
        run: |
          {
            echo "### LeaveCtrl production browser regression"
            echo "- Matrix: ${{ matrix.label }}"
            echo "- Protected-route redirect: PASS"
            echo "- Responsive viewport overflow: PASS"
            echo "- Keyboard focus visibility: PASS"
            echo "- WCAG serious/critical scan: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
