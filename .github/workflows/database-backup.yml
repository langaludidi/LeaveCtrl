name: Production database backup

on:
  schedule:
    # 00:35 UTC = 02:35 South Africa Standard Time (UTC+2).
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/database-backup.yml"

permissions:
  contents: read

concurrency:
  group: production-database-backup
  cancel-in-progress: false

env:
  SUPABASE_DB_HOST: aws-1-eu-west-1.pooler.supabase.com
  SUPABASE_DB_PORT: "5432"
  SUPABASE_DB_USER: postgres.nihvucwfzajudsejczzz
  SUPABASE_DB_NAME: postgres

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Require backup password secret
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is not configured. Add the raw Supabase database password as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create Supabase logical backup
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p backup

          ENCODED_PASSWORD="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')"
          SUPABASE_DB_URL="postgresql://${SUPABASE_DB_USER}:${ENCODED_PASSWORD}@${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}"
          echo "::add-mask::$SUPABASE_DB_URL"

          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          test -s backup/roles.sql
          test -s backup/schema.sql
          test -s backup/data.sql

          sha256sum backup/roles.sql backup/schema.sql backup/data.sql > backup/SHA256SUMS
          date -u +"%Y-%m-%dT%H:%M:%SZ" > backup/created-at-utc.txt
          printf '%s\n' "LeaveCtrl production logical database backup" > backup/README.txt
          printf '%s\n' "Created with the official Supabase CLI backup method." >> backup/README.txt
          printf '%s\n' "Restore only to an isolated recovery database first. Never restore directly over production." >> backup/README.txt

      - name: Upload protected backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: leavectrl-db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Backup summary
        shell: bash
        run: |
          {
            echo "### LeaveCtrl database backup"
            echo "- Supabase roles dump created successfully"
            echo "- Schema dump created successfully"
            echo "- Data dump created successfully"
            echo "- SHA-256 checksums generated"
            echo "- Artifact retention: 7 days"
            echo "- Recovery rule: restore to an isolated database before any production recovery"
          } >> "$GITHUB_STEP_SUMMARY"
