name: Migration replay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "tests/rbac-matrix.sql"
      - "tests/security-definer-live-contract.sql"
      - ".github/workflows/migration-replay.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "tests/rbac-matrix.sql"
      - "tests/security-definer-live-contract.sql"
      - ".github/workflows/migration-replay.yml"

permissions:
  contents: read

concurrency:
  group: migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialise local Supabase config
        run: supabase init --force

      - name: Start minimal local Supabase stack
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,mailpit,postgres-meta,supavisor

      - name: Replay every migration from zero
        run: supabase db reset --local --no-seed

      - name: Verify complete migration history
        shell: bash
        run: |
          set -euo pipefail
          expected_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          expected_latest="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -1 | cut -d_ -f1)"

          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          test -n "$db_container"

          actual_count="$(docker exec "$db_container" psql -U postgres -d postgres -Atc 'select count(*) from supabase_migrations.schema_migrations')"
          actual_latest="$(docker exec "$db_container" psql -U postgres -d postgres -Atc 'select max(version) from supabase_migrations.schema_migrations')"

          echo "Expected migrations: $expected_count"
          echo "Applied migrations:  $actual_count"
          echo "Expected latest:      $expected_latest"
          echo "Applied latest:       $actual_latest"

          test "$actual_count" = "$expected_count"
          test "$actual_latest" = "$expected_latest"

      - name: Verify current privileged RPC surface
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/security-definer-live-contract.sql

      - name: Run six-role RBAC and tenant-isolation matrix
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < tests/rbac-matrix.sql

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup || true
