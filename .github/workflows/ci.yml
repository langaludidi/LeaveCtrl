name: CI

on:
  push:
    branches:
      - main
      - build/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Unit tests
        run: npm test
      - name: Critical business logic coverage
        run: npm run test:critical-coverage
      - name: Dependency audit
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=moderate; then
              exit 0
            fi
            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 5))
          done
      - name: Production build
        run: npm run build
